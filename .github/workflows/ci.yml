name: ci

# The golden pipeline. Service repos call this with a 12-line workflow.
# The four checks are composite actions (steps that share one job's workspace);
# the pipeline itself is a reusable workflow (a whole job graph with its own
# runners and permissions). See README.md.

on:
  workflow_call:
    inputs:
      context:
        description: Docker build context.
        type: string
        default: "."
      dockerfile:
        description: Dockerfile path.
        type: string
        default: "Dockerfile"
      image-name:
        description: Image name. Defaults to the caller's repository name.
        type: string
        default: ""
      env-repo:
        description: Repo that holds desired state. Defaults to <owner>/env-dev.
        type: string
        default: ""
    secrets:
      ENV_REPO_TOKEN:
        description: Token that can open pull requests on the env repo and nothing else.
        required: true
    outputs:
      digest:
        description: Digest of the image pushed to GHCR (sha256:...).
        value: ${{ jobs.publish.outputs.digest }}
      image:
        description: Image reference without a tag, for example ghcr.io/owner/name.
        value: ${{ jobs.publish.outputs.image }}

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: hvohra/platform-workflows/actions/lint@v1

      # Before build-image on purpose: .ci/image.tar would otherwise be scanned too.
      - uses: hvohra/platform-workflows/actions/secret-scan@v1

      - id: build
        uses: hvohra/platform-workflows/actions/build-image@v1
        with:
          context: ${{ inputs.context }}
          dockerfile: ${{ inputs.dockerfile }}
          image-name: ${{ inputs.image-name }}

      # No inputs pointing at build's output: it reads .ci/ from the workspace.
      - uses: hvohra/platform-workflows/actions/image-scan@v1

      # Hand the exact scanned image to the publish job. Publishing a rebuild
      # would mean the thing pushed is not the thing that was scanned.
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: .ci/
          # .ci is a dot-directory and upload-artifact skips those by default.
          include-hidden-files: true
          retention-days: 1

  publish:
    needs: ci
    runs-on: ubuntu-24.04
    # A called workflow cannot ask for more than its caller granted, and the
    # caller grants only packages and id-token. Requesting contents: here would
    # be a startup failure.
    permissions:
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image
          path: .ci

      - name: Load the image that was scanned
        run: docker load --input .ci/image.tar

      - name: Log in to GHCR
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin

      - name: Push and capture the digest
        id: push
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          local_ref="$(cat .ci/image.ref)"
          name="${IMAGE_NAME:-${GITHUB_REPOSITORY#*/}}"
          image="ghcr.io/${OWNER,,}/${name}"

          docker tag "$local_ref" "${image}:${GITHUB_SHA::12}"
          docker push "${image}:${GITHUB_SHA::12}" | tee push.log

          # The line is: "<tag>: digest: sha256:<64 hex> size: <n>"
          digest="$(grep -E ': digest: sha256:' push.log | grep -oE 'sha256:[a-f0-9]{64}' | tail -1)"
          test -n "$digest"

          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          {
            echo "### Published"
            echo "- Image: \`${image}\`"
            echo "- Digest: \`${digest}\`"
            echo "- Pull by digest: \`${image}@${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Promotion is a pull request, never a push. This job opens it; a named human
  # merges it; the cluster pulls the merge. Nothing here can deploy.
  promote:
    needs: publish
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Open a one-line promotion PR against the env repo
        env:
          GH_TOKEN: ${{ secrets.ENV_REPO_TOKEN }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          IMAGE_NAME: ${{ inputs.image-name }}
          ENV_REPO: ${{ inputs.env-repo }}
        run: |
          set -euo pipefail
          name="${IMAGE_NAME:-${GITHUB_REPOSITORY#*/}}"
          env_repo="${ENV_REPO:-${GITHUB_REPOSITORY_OWNER}/env-dev}"
          values="values/${name}.yaml"
          branch="promote/${name}-${GITHUB_SHA::12}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${env_repo}.git" env
          cd env
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"

          # The only line the pipeline is allowed to change.
          sed -i -E "s|^(  digest: ).*|\1${DIGEST}|" "$values"

          if git diff --quiet; then
            echo "Digest already ${DIGEST} in ${values}; nothing to promote."
            exit 0
          fi

          # Fail closed if the edit was not exactly one line replaced by one line.
          stat="$(git diff --numstat -- "$values" | awk '{a+=$1; d+=$2} END {print a" "d}')"
          if [ "$stat" != "1 1" ]; then
            echo "::error::Expected a 1-line change, got (added removed) = ${stat}"
            git diff
            exit 1
          fi

          git commit --quiet --all --message "Promote ${name} to ${DIGEST:0:19}"
          git push --quiet origin "$branch"

          gh pr create \
            --repo "$env_repo" \
            --base main \
            --head "$branch" \
            --title "Promote ${name}: ${DIGEST:0:19}" \
            --body "$(printf 'Changes one line: `image.digest` in `%s`.\n\n- Digest: `%s`\n- Source commit: %s/%s/commit/%s\n- Pipeline run: %s\n\nMerging this is the approval. Flux deploys the merge. To roll back, revert the merge commit.' "$values" "$DIGEST" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$run_url")"
