name: lint
description: Run yamllint over a directory. Fails the step on any error-level finding.

inputs:
  path:
    description: Directory to lint, relative to the caller's workspace.
    required: false
    default: "."
  config:
    description: yamllint inline config (YAML flow mapping).
    required: false
    default: "{extends: relaxed, rules: {line-length: disable, truthy: {check-keys: false}}}"

runs:
  using: "composite"
  steps:
    - name: Install yamllint
      shell: bash
      run: |
        # A venv, because the runner's system Python is externally managed (PEP 668).
        python3 -m venv "$RUNNER_TEMP/yamllint-venv"
        "$RUNNER_TEMP/yamllint-venv/bin/pip" install --quiet yamllint==1.35.1

    - name: Lint
      shell: bash
      env:
        LINT_PATH: ${{ inputs.path }}
        LINT_CONFIG: ${{ inputs.config }}
      run: |
        "$RUNNER_TEMP/yamllint-venv/bin/yamllint" --config-data "$LINT_CONFIG" "$LINT_PATH"
